name: CI Pipeline Spring Boot

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build con Maven
        run: ./mvnw -B clean compile

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B test

      - name: Reporte de cobertura JaCoCo
        run: ./mvnw -B jacoco:report

      - name: Publicar reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco

      - name: Verificar variable de entorno
        env:
          APP_ENV: ${{ secrets.APP_ENV_DEMO }}
        run: |
          echo "Ejecutando en el ambiente configurado"
          echo "Valor recibido: $APP_ENV"
